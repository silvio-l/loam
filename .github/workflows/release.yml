name: Release

# GitHub builds NOTHING for a release (Actions minutes are scarce, issue #15).
# The native binaries, their .sha256 files, the GitHub-release assets and the
# Homebrew formula are produced locally by tool/release-local.sh (macOS on the
# Mac, Linux/Windows on the test-lab VMs). The only job left here publishes
# the package to pub.dev via OIDC on the tag push; it compiles no binaries.

on:
  push:
    tags: ['v*']

# Least privilege: the single job overrides this with what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  pub-dev:
    name: Publish to pub.dev (OIDC)
    # pub.dev only trusts the OIDC token of a run whose own trigger ref is a tag
    # (push:tags). A workflow_dispatch run has a branch ref and is rejected, so
    # this workflow has no manual trigger: re-publish by deleting + re-pushing
    # the tag.
    runs-on: ubuntu-latest
    # Job-Level-permissions ERSETZEN die Top-Level-Defaults: id-token fürs
    # OIDC-Publishing, contents:read fürs checkout. Kein pub.dev-Secret nötig —
    # pub.dev vertraut dem OIDC-Token des getaggten Runs (Automated Publishing
    # muss am Paket aktiviert sein: Repo silvio-l/loam, Tag-Pattern v{{version}}).
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      # Pinned, matching qa.yml — reproducible pub.dev publishes.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.7'

      - name: dart pub get
        working-directory: packages/loam_cli
        run: dart pub get

      # dart pub publish nutzt in GitHub Actions mit id-token:write automatisch
      # den OIDC-Token. --force überspringt die interaktive Bestätigung. Läuft der
      # Job gegen eine bereits publizierte Version (Re-Tag/Re-Run), schlägt pub.dev
      # bewusst mit "version already exists" fehl.
      - name: Publish to pub.dev
        working-directory: packages/loam_cli
        run: dart pub publish --force
