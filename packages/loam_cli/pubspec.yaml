name: loam
description: "Dart/Flutter: unused API, circular deps, boundaries, duplicates, complexity, catch, secrets, ignores, narrative/workflow/placeholder, stubs, assertions, resources, setState, a11y."
version: 0.1.16
repository: https://github.com/silvio-l/loam
homepage: https://getloam.dev
topics:
  - cli
  - static-analysis
  - code-quality
  - analyzer
  - developer-tools

environment:
  sdk: ^3.11.0

executables:
  loam: loam
dependencies:
  # Pinned to tested minor versions: lib/src/loader/analyzer_cache.dart uses
  # analyzer internals (AnalysisContextCollectionImpl(byteStore:),
  # FileByteStore.flush/writeCount, the latter from 14.4.0 on), which are not
  # covered by semver; a break in a newer minor would break
  # `dart pub global activate loam` for users. Raise the upper bound at each
  # release after checking that file; criterion: analyzer_cache_test is green
  # on the newest analyzer allowed.
  analyzer: ">=14.4.0 <14.8.0"
  args: ^2.7.0
  crypto: ^3.0.0
  glob: ^2.1.2
  path: ^1.9.0
  pub_semver: ^2.1.4
  yaml: ^3.1.3
dev_dependencies:
  json_schema: ^5.2.2
  lints: ^6.1.0
  test: ^1.31.1
